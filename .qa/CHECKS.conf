# Одна безопасная локальная команда на строку.
# Пустой файл включает автоматическое определение Node/PHP/Python-команд.
#
# Ниже — реальные, проверенные вручную команды этого монорепо (pnpm workspaces).
# lint НЕ включён: package.json объявляет "lint", но eslint фактически не
# установлен/не настроен ни в apps/api, ни в apps/web (проверено — команда падает
# с "eslint not found"). Не выдумываем рабочую проверку там, где её нет.
# apps/api "test" НЕ включён: vitest настроен, но тестовых файлов там нет
# (все тесты — только в packages/shared), команда падает "No test files found".

pnpm --filter @cleartg/shared build
pnpm --filter @cleartg/shared test
pnpm --filter @cleartg/api exec tsc --noEmit
pnpm --filter @cleartg/web exec tsc --noEmit

# Не добавляйте production-deploy, удаление данных и реальные платежи.
